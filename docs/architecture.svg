<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ana revela uma carta e recebe a resposta na hora; o celular de Bruno só descobre a mudança no próximo polling, até 2 segundos depois — os dois sempre reconciliados pelo mesmo estado gravado no MySQL, nunca um pelo outro.">
  <defs>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D95757"/>
    </marker>
    <marker id="arrow-petrol" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#315C68"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#171717"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#F4EFE6" rx="14"/>

  <!-- Ana's phone -->
  <rect x="40" y="40" width="270" height="90" rx="10" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="175" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#171717">Celular de Ana</text>
  <text x="175" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68645E">acabou de tocar "Revelar carta"</text>
  <text x="175" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68645E">(a vez é dela)</text>

  <!-- Bruno's phone -->
  <rect x="590" y="40" width="270" height="90" rx="10" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="725" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#171717">Celular de Bruno</text>
  <text x="725" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68645E">só está com a tela aberta,</text>
  <text x="725" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68645E">esperando a vez</text>

  <!-- Backend -->
  <rect x="140" y="290" width="620" height="90" rx="10" fill="#171717"/>
  <text x="450" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#F4EFE6">Backend</text>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B7AB8C">não guarda nada entre requisições — só lê e grava no banco</text>

  <!-- MySQL -->
  <rect x="360" y="460" width="180" height="60" rx="10" fill="#718F72"/>
  <text x="450" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff">MySQL</text>

  <!-- Ana: request down (left lane) -->
  <line x1="130" y1="132" x2="185" y2="288" stroke="#D95757" stroke-width="2.5" marker-end="url(#arrow-coral)"/>
  <!-- Ana: instant response back (right lane, clear gap from the line above) -->
  <line x1="260" y1="288" x2="220" y2="132" stroke="#D95757" stroke-width="2.5" marker-end="url(#arrow-coral)"/>

  <rect x="55" y="178" width="90" height="20" fill="#F4EFE6"/>
  <text x="100" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D95757" font-weight="700">POST /reveal</text>

  <rect x="245" y="215" width="120" height="20" fill="#F4EFE6"/>
  <text x="305" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#D95757" font-weight="700">estado novo, já</text>

  <!-- Bruno: poll down (left lane) -->
  <line x1="680" y1="132" x2="635" y2="288" stroke="#315C68" stroke-width="2.5" marker-end="url(#arrow-petrol)"/>
  <!-- Bruno: eventual response back (right lane) -->
  <line x1="710" y1="288" x2="755" y2="132" stroke="#315C68" stroke-width="2.5" marker-end="url(#arrow-petrol)"/>

  <rect x="530" y="178" width="140" height="38" fill="#F4EFE6"/>
  <text x="600" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#315C68" font-weight="700">GET /matches/:code</text>
  <text x="600" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#315C68">a cada ~2s</text>

  <rect x="695" y="215" width="150" height="38" fill="#F4EFE6"/>
  <text x="770" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#315C68" font-weight="700">mesmo estado, até</text>
  <text x="770" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#315C68" font-weight="700">2s depois</text>

  <!-- Backend <-> MySQL -->
  <line x1="410" y1="382" x2="410" y2="458" stroke="#171717" stroke-width="2.5" marker-end="url(#arrow-ink)"/>
  <line x1="490" y1="458" x2="490" y2="382" stroke="#171717" stroke-width="2.5" marker-end="url(#arrow-ink)"/>

  <rect x="270" y="412" width="110" height="20" fill="#F4EFE6"/>
  <text x="325" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#171717">grava a carta</text>

  <rect x="520" y="412" width="90" height="20" fill="#F4EFE6"/>
  <text x="565" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#171717">lê o estado</text>
</svg>
